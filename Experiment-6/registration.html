<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Experiment 6 - Form Validation</title></head>
<body>
<h1>Registration Form - Name and Password validation</h1>
<form name="regForm" onsubmit="return validateForm()" action="#">
<label for="name">Name:</label><input type="text" id="name" name="name" required><br><br>
<label for="password">Password:</label><input type="password" id="password" name="password" required><br><br>
<input type="submit" value="Submit"><input type="reset" value="Reset">
</form>
<script src="validation.js"></script>
</body></html>
