<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<style>body{font-family:Arial,sans-serif;margin:30px}label{display:inline-block;min-width:130px}input,select,textarea{margin:4px 0} .line{margin-bottom:10px}</style>
</head>
<body>
<h1>Registration Form</h1>
<form action="#" method="post" name="regForm">
<div class="line"><label for="name">Name:</label><input type="text" id="name" name="name" required></div>
<div class="line"><label for="password">Password:</label><input type="password" id="password" name="password" required></div>
<div class="line"><label for="email">E-mail ID:</label><input type="email" id="email" name="email" required></div>
<div class="line"><label for="phone">Phone Number:</label><input type="tel" id="phone" name="phone" required></div>
<div class="line"><label>Sex:</label>
<input type="radio" id="male" name="sex" value="Male" required><label for="male" style="min-width:auto">Male</label>
<input type="radio" id="female" name="sex" value="Female"><label for="female" style="min-width:auto">Female</label>
<input type="radio" id="other" name="sex" value="Other"><label for="other" style="min-width:auto">Other</label></div>
<div class="line"><label for="day">Date of Birth:</label>
<select id="day" name="day" required><option value="">Day</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option></select>
<select id="month" name="month" required><option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select>
<select id="year" name="year" required><option value="">Year</option><option>2000</option><option>2001</option><option>2002</option><option>2003</option><option>2004</option><option>2005</option><option>2006</option><option>2007</option><option>2008</option><option>2009</option><option>2010</option></select></div>
<div class="line"><label>Language Known:</label>
<input type="checkbox" id="english" name="languages[]" value="English"><label for="english" style="min-width:auto">English</label>
<input type="checkbox" id="telugu" name="languages[]" value="Telugu"><label for="telugu" style="min-width:auto">Telugu</label>
<input type="checkbox" id="hindi" name="languages[]" value="Hindi"><label for="hindi" style="min-width:auto">Hindi</label>
<input type="checkbox" id="tamil" name="languages[]" value="Tamil"><label for="tamil" style="min-width:auto">Tamil</label></div>
<div class="line"><label for="address">Address:</label><br><textarea id="address" name="address" rows="4" cols="50"></textarea></div>
<input type="submit" value="Submit"><input type="reset" value="Reset">
</form>
</body>
</html>
